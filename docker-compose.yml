services:
  yaws:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_PATH: "../data/yaws.sqlite"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      BOOTSTRAP_TOKEN: "${BOOTSTRAP_TOKEN:-}"
      AGENT_KEY_SECRET: "${AGENT_KEY_SECRET:?set AGENT_KEY_SECRET in .env}"
      AGENT_KEY_SECRET_PREVIOUS: "${AGENT_KEY_SECRET_PREVIOUS:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3001}"
      METRICS_RETENTION_DAYS: "30"
      METRICS_PRUNE_INTERVAL_MIN: "10"
      ADMIN_RESTORE_MAX_MB: "2048"
      # Optional telegram bot notifications:
      # TELEGRAM_BOT_TOKEN: ""
      # TELEGRAM_CHAT_ID: ""
      AGENT_GITHUB_REPO: "yamatu/yaws"
      # Optional override:
      # AGENT_RELEASE_BASE_URL: "https://github.com/OWNER/REPO/releases/latest/download"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
